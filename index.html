<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPSC Active Recall & Flashcards</title>
  <style>
    /* Color Palette & Base Variables */
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Header & Navigation */
    header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    button {
      background: #334155;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    button:hover { background: #475569; }
    button.primary { background: #0284c7; border-color: #0284c7; }
    button.primary:hover { background: #0369a1; }

    /* Filter & Stats */
    .filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    select {
      background: #0f172a;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
    }

    .stats { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }

    /* Progress Bar */
    .progress-container {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* 3D Flashcard Stage */
    .flashcard-stage {
      perspective: 1200px;
      width: 100%;
      max-width: 720px;
      height: 400px;
      margin: 12px 0;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      cursor: pointer;
    }

    .card.is-flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .card-back {
      transform: rotateY(180deg);
      background: #162032;
      border-color: #38bdf8;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }

    .badge-subject {
      font-size: 0.75rem;
      padding: 4px 8px;
      background: #0369a1;
      border-radius: 6px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Leitner Boxes Badges */
    .badge-box { font-size: 0.75rem; padding: 4px 8px; border-radius: 6px; font-weight: 600; }
    .box-1 { background: #7f1d1d; color: #fca5a5; }
    .box-2 { background: #78350f; color: #fde68a; }
    .box-3 { background: #064e3b; color: #6ee7b7; }

    .card-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-y: auto;
      padding: 12px 0;
      user-select: text;
    }

    .card-content.answer {
      text-align: left;
      align-items: flex-start;
      white-space: pre-line;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    .card-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Bottom Control Bar */
    .controls {
      width: 100%;
      max-width: 720px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .btn-review {
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      color: #fff;
    }

    .btn-again { background: var(--red); }
    .btn-again:hover { background: #dc2626; }
    .btn-good { background: var(--green); }
    .btn-good:hover { background: #059669; }

    .card-subactions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      width: 100%;
      max-width: 720px;
    }

    .btn-link {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: underline;
    }
    .btn-link:hover { color: var(--text-main); }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      width: 100%;
      max-width: 540px;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .modal-content h3 { font-size: 1.25rem; color: var(--accent); }

    .input-field {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px;
      border-radius: 8px;
      outline: none;
      font-size: 1rem;
    }

    textarea.input-field { min-height: 120px; resize: vertical; }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 10px;
    }

    @media (max-width: 600px) {
      .flashcard-stage { height: 340px; }
      .card-face { padding: 16px; }
      .btn-review { font-size: 1rem; padding: 12px; }
      .card-content.answer { font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="title">BPSC Master Recall</div>
      <div class="action-btns">
        <button id="btnNewCard" class="primary">+ नया कार्ड</button>
        <button id="btnBackup">बैकअप / इम्पोर्ट</button>
      </div>
    </div>

    <div class="filter-bar">
      <div style="display: flex; align-items: center; gap: 8px;">
        <label for="subjectSelect" style="font-size: 0.85rem; color: var(--text-muted);">विषय:</label>
        <select id="subjectSelect">
          <option value="ALL">सभी विषय</option>
        </select>
      </div>
      <div class="stats" id="statsDisplay">कार्ड 0/0</div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </header>

  <!-- Flashcard Screen -->
  <main class="flashcard-stage">
    <div class="card" id="flashcard">
      
      <!-- Card Front -->
      <div class="card-face card-front">
        <div class="card-header">
          <span class="badge-subject" id="cardSubjectFront">-</span>
          <span class="badge-box box-1" id="cardBoxFront">Box 1</span>
        </div>
        <div class="card-content">
          <h2 id="cardQuestion" style="font-size: 1.25rem; font-weight: 600;">लोड हो रहा है...</h2>
        </div>
        <div class="card-hint">टैप करें या Space दबाएँ (उत्तर देखें)</div>
      </div>

      <!-- Card Back -->
      <div class="card-face card-back">
        <div class="card-header">
          <span class="badge-subject" id="cardSubjectBack">-</span>
          <span class="badge-box box-1" id="cardBoxBack">Box 1</span>
        </div>
        <div class="card-content answer" id="cardAnswer">
          उत्तर यहाँ प्रदर्शित होगा...
        </div>
        <div class="card-hint">ग्रेड तय करें (← दोबारा पढ़ो / याद रहा →)</div>
      </div>

    </div>
  </main>

  <!-- Controls -->
  <footer class="controls">
    <button class="btn-review btn-again" id="btnAgain">
      ✕ दोबारा पढ़ो (←)
    </button>
    <button class="btn-review btn-good" id="btnGood">
      ✓ याद रहा (→)
    </button>
  </footer>

  <div class="card-subactions">
    <button class="btn-link" id="btnEditCard">संपादित करें (Edit)</button>
    <button class="btn-link" style="color: #f87171;" id="btnDeleteCard">हटाएँ (Delete)</button>
  </div>

  <!-- Modal 1: Add / Edit Card -->
  <div class="modal-overlay" id="cardModal">
    <div class="modal-content">
      <h3 id="modalTitle">नया कार्ड जोड़ें</h3>
      <input type="hidden" id="editCardId">
      <div>
        <label style="font-size: 0.85rem; color: var(--text-muted);">विषय (Subject):</label>
        <input type="text" id="inputSubject" class="input-field" placeholder="उदा. इतिहास, राजव्यवस्था, बिहार विशेष">
      </div>
      <div>
        <label style="font-size: 0.85rem; color: var(--text-muted);">मुख्य प्रश्न (Question):</label>
        <input type="text" id="inputQuestion" class="input-field" placeholder="स्पष्ट व संक्षिप्त प्रश्न लिखें">
      </div>
      <div>
        <label style="font-size: 0.85rem; color: var(--text-muted);">बुलेट उत्तर (Answer):</label>
        <textarea id="inputAnswer" class="input-field" placeholder="बुलेट पॉइंट्स (\n•) में मुख्य तथ्य लिखें..."></textarea>
      </div>
      <div class="modal-buttons">
        <button id="btnCancelCardModal">रद्द करें</button>
        <button class="primary" id="btnSaveCard">सहेजें (Save)</button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Backup / Bulk Import-Export -->
  <div class="modal-overlay" id="backupModal">
    <div class="modal-content">
      <h3>डेटा बैकअप व बल्क इम्पोर्ट</h3>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">अपने सभी कार्ड्स सुरक्षित करें या जेमिनी से मिला नया JSON यहाँ पेस्ट करें।</p>
      
      <div style="display: flex; gap: 8px;">
        <button id="btnDownloadJson" class="primary" style="flex: 1;">📥 JSON डाउनलोड</button>
        <button id="btnCopyJson" style="flex: 1;">📋 क्लिपबोर्ड कॉपी</button>
      </div>

      <div style="margin-top: 10px;">
        <label style="font-size: 0.85rem; color: var(--text-muted);">बल्क JSON डेटा यहाँ पेस्ट करें:</label>
        <textarea id="importJsonArea" class="input-field" style="min-height: 140px;" placeholder='[{"subject":"विषय","question":"प्रश्न","answer":"उत्तर","box":1}]'></textarea>
      </div>

      <div class="modal-buttons">
        <button id="btnCloseBackupModal">बंद करें</button>
        <button class="primary" id="btnImportJson">इम्पोर्ट करें (Merge)</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "bpsc_active_recall_v2";

    // Default Deck with Standard Digits (1, 2, 3...)
    const DEFAULT_DECK = [
      {
        id: "card_def_1",
        subject: "बिहार विशेष",
        question: "1857 के संग्राम में वीर कुंवर सिंह की सैन्य रणनीति के प्रमुख बिंदु क्या थे?",
        answer: "• छापामार (Guerrilla) युद्ध पद्धति का व्यापक प्रयोग किया।\n• रोहतास, मिर्जापुर, रीवा और बांदा के विप्लवियों के साथ समन्वय स्थापित किया।\n• 23 अप्रैल 1858 को जगदीशपुर में कैप्टन ली ग्रांड को पराजित कर यूनियन जैक उतारा।",
        box: 1, repetitions: 0
      },
      {
        id: "card_def_2",
        subject: "राजव्यवस्था",
        question: "अनुच्छेद 32 (संवैधानिक उपचारों का अधिकार) को डॉ. आंबेडकर ने संविधान की आत्मा क्यों कहा?",
        answer: "• मूल अधिकारों के उल्लंघन पर सीधे सुप्रीम कोर्ट जाने की गारंटी देता है।\n• न्यायालय को 5 प्रकार की रिट जारी करने की शक्ति देता है।\n• बिना उपचार के अधिकार मात्र खोखली घोषणा बन जाते हैं।",
        box: 1, repetitions: 0
      },
      {
        id: "card_def_3",
        subject: "आधुनिक भारत",
        question: "चंपारण सत्याग्रह (1917) के प्रमुख कारण और तिनकठिया प्रणाली क्या थी?",
        answer: "• तिनकठिया प्रणाली: किसानों को अपनी भूमि के 3/20 भाग पर अनिवार्य रूप से नील की खेती करनी होती थी।\n• रासायनिक रंगों के विकास के बाद यूरोपीय बागान मालिकों ने क्षतिपूर्ति के नाम पर 'शरहबेशी' और 'तवान' वसूला।\n• राजकुमार शुक्ल ने 1916 के लखनऊ अधिवेशन में गांधी जी को बिहार आने के लिए राजी किया।",
        box: 1, repetitions: 0
      },
      {
        id: "card_def_4",
        subject: "आधुनिक भारत",
        question: "चंपारण एग्रेरियन कमेटी के मुख्य निष्कर्ष एवं परिणाम क्या रहे?",
        answer: "• एफ. जी. स्लाई की अध्यक्षता में कमेटी बनी, जिसमें गांधी जी भी सदस्य थे।\n• तिनकठिया प्रणाली को पूरी तरह समाप्त घोषित किया गया।\n• बागान मालिकों द्वारा अवैध रूप से वसूले गए धन का 25% हिस्सा किसानों को वापस लौटाने पर सहमति बनी।",
        box: 1, repetitions: 0
      },
      {
        id: "card_def_5",
        subject: "आधुनिक भारत",
        question: "संथाल विद्रोह (1855-56) के मूल कारण और 'दामिन-इ-कोह' का संदर्भ क्या था?",
        answer: "• दामिन-इ-कोह: राजमहल की पहाड़ियों का वन क्षेत्र, जहाँ संथालों को बसाया गया था।\n• कारण: महाजनों (दिकू) द्वारा 50% से 500% तक ब्याज, पुलिसिया अत्याचार।\n• नेतृत्व: 30 जून 1855 को भगनाडीह में सिदो, कान्हू, चाँद और भैरव ने विद्रोह किया।",
        box: 1, repetitions: 0
      },
      {
        id: "card_def_6",
        subject: "आधुनिक भारत",
        question: "बिरसा मुंडा आंदोलन / उलगुलान (1899-1900) का मुख्य स्वरूप क्या था?",
        answer: "• मुख्य कारण: 'खूंटकट्टी' (सामूहिक भू-स्वामित्व व्यवस्था) का जमींदारों द्वारा खात्मा।\n• स्वरूप: धार्मिक सुधार से शुरू होकर राजनीतिक स्वायत्तता ('मुंडा राज') में बदला।\n• परिणाम: 1908 का 'छोटानागपुर काश्तकारी अधिनियम (CNT Act)' पारित, जिसने खूंटकट्टी अधिकारों को मान्यता दी।",
        box: 1, repetitions: 0
      }
    ];

    let allCards = [];
    let reviewQueue = [];
    let currentIndex = 0;
    let selectedSubject = "ALL";

    // DOM Elements
    const flashcard = document.getElementById("flashcard");
    const subjectSelect = document.getElementById("subjectSelect");
    const statsDisplay = document.getElementById("statsDisplay");
    const progressBar = document.getElementById("progressBar");

    // Init App
    function initApp() {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) {
        try {
          allCards = JSON.parse(stored);
          if(allCards.length === 0) allCards = [...DEFAULT_DECK]; // Fallback if empty array
        } catch (e) {
          allCards = [...DEFAULT_DECK];
        }
      } else {
        allCards = [...DEFAULT_DECK];
        saveCards();
      }

      populateSubjectFilter();
      buildReviewQueue();
      renderCard();
      bindEvents();
    }

    function saveCards() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(allCards));
    }

    // Populate Dynamic Subject Dropdown
    function populateSubjectFilter() {
      const subjects = ["ALL", ...new Set(allCards.map(c => c.subject.trim()))];
      subjectSelect.innerHTML = subjects.map(sub => 
        `<option value="${sub}" ${sub === selectedSubject ? "selected" : ""}>${sub === "ALL" ? "सभी विषय (All Subjects)" : sub}</option>`
      ).join("");
    }

    // Build Leitner-Prioritized Queue
    function buildReviewQueue() {
      let filtered = selectedSubject === "ALL" 
        ? [...allCards] 
        : allCards.filter(c => c.subject.trim() === selectedSubject);

      // Sort logic: Box 1 (hardest) shown first, then Box 2, then Box 3
      filtered.sort((a, b) => (a.box || 1) - (b.box || 1));

      reviewQueue = filtered;
      currentIndex = 0;
    }

    // Render Current Card
    function renderCard() {
      flashcard.classList.remove("is-flipped");

      if (reviewQueue.length === 0) {
        document.getElementById("cardSubjectFront").textContent = "शून्य कार्ड";
        document.getElementById("cardSubjectBack").textContent = "-";
        document.getElementById("cardQuestion").textContent = "इस विषय में कोई कार्ड उपलब्ध नहीं है।";
        document.getElementById("cardAnswer").textContent = "";
        statsDisplay.textContent = "0 / 0";
        progressBar.style.width = "0%";
        return;
      }

      const card = reviewQueue[currentIndex];
      
      document.getElementById("cardSubjectFront").textContent = card.subject;
      document.getElementById("cardSubjectBack").textContent = card.subject;
      document.getElementById("cardQuestion").textContent = card.question;
      document.getElementById("cardAnswer").textContent = card.answer;

      const boxNum = card.box || 1;
      const boxClass = `box-${boxNum}`;
      const boxText = boxNum === 1 ? "Box 1 (कच्चा)" : boxNum === 2 ? "Box 2 (अभ्यासरत)" : "Box 3 (कंठस्थ)";

      const badgeFront = document.getElementById("cardBoxFront");
      const badgeBack = document.getElementById("cardBoxBack");
      
      badgeFront.className = `badge-box ${boxClass}`;
      badgeFront.textContent = boxText;
      badgeBack.className = `badge-box ${boxClass}`;
      badgeBack.textContent = boxText;

      statsDisplay.textContent = `कार्ड ${currentIndex + 1} / ${reviewQueue.length}`;
      progressBar.style.width = `${((currentIndex + 1) / reviewQueue.length) * 100}%`;
    }

    // Spaced Repetition Logic (Leitner System)
    function handleReview(isSuccess) {
      if (reviewQueue.length === 0) return;

      const currentCard = reviewQueue[currentIndex];
      const originalCard = allCards.find(c => c.id === currentCard.id);

      if (originalCard) {
        originalCard.repetitions = (originalCard.repetitions || 0) + 1;
        originalCard.lastReviewed = new Date().toISOString().split("T")[0];
        
        // Ensure box property exists
        if(!originalCard.box) originalCard.box = 1; 

        if (isSuccess) {
          // Promote card (Max Box 3)
          originalCard.box = Math.min(3, originalCard.box + 1);
        } else {
          // Demote to Box 1
          originalCard.box = 1;
          // Re-insert into current queue to force review again in this session
          reviewQueue.push(originalCard); 
        }
        saveCards();
      }

      if (currentIndex < reviewQueue.length - 1) {
        currentIndex++;
        renderCard();
      } else {
        // Session complete
        alert("🎉 इस सत्र का रिवीजन पूर्ण हुआ! प्रगति सहेज ली गई है।");
        buildReviewQueue();
        renderCard();
      }
    }

    // Event Listeners
    function bindEvents() {
      // 3D Flip Action
      flashcard.addEventListener("click", () => {
        if(reviewQueue.length > 0) flashcard.classList.toggle("is-flipped");
      });

      // Review Grading Buttons
      document.getElementById("btnAgain").addEventListener("click", (e) => {
        e.stopPropagation();
        handleReview(false);
      });

      document.getElementById("btnGood").addEventListener("click", (e) => {
        e.stopPropagation();
        handleReview(true);
      });

      // Subject Filter
      subjectSelect.addEventListener("change", (e) => {
        selectedSubject = e.target.value;
        buildReviewQueue();
        renderCard();
      });

      // Keyboard Shortcuts (Space, Left/Right Arrows)
      window.addEventListener("keydown", (e) => {
        if (document.getElementById("cardModal").style.display === "flex" || 
            document.getElementById("backupModal").style.display === "flex") {
          return; // Ignore shortcuts if modal is open
        }
        if (reviewQueue.length === 0) return;

        if (e.code === "Space") {
          e.preventDefault();
          flashcard.classList.toggle("is-flipped");
        } else if (e.code === "ArrowLeft") {
          e.preventDefault();
          handleReview(false);
        } else if (e.code === "ArrowRight") {
          e.preventDefault();
          handleReview(true);
        }
      });

      // --- Modals Logic ---
      const cardModal = document.getElementById("cardModal");
      const backupModal = document.getElementById("backupModal");

      // Add Card Trigger
      document.getElementById("btnNewCard").addEventListener("click", () => {
        document.getElementById("modalTitle").textContent = "नया कार्ड जोड़ें";
        document.getElementById("editCardId").value = "";
        document.getElementById("inputSubject").value = selectedSubject !== "ALL" ? selectedSubject : "";
        document.getElementById("inputQuestion").value = "";
        document.getElementById("inputAnswer").value = "";
        cardModal.style.display = "flex";
      });

      // Edit Card Trigger
      document.getElementById("btnEditCard").addEventListener("click", () => {
        if (reviewQueue.length === 0) return;
        const card = reviewQueue[currentIndex];
        document.getElementById("modalTitle").textContent = "कार्ड संपादित करें";
        document.getElementById("editCardId").value = card.id;
        document.getElementById("inputSubject").value = card.subject;
        document.getElementById("inputQuestion").value = card.question;
        document.getElementById("inputAnswer").value = card.answer;
        cardModal.style.display = "flex";
      });

      // Delete Card
      document.getElementById("btnDeleteCard").addEventListener("click", () => {
        if (reviewQueue.length === 0) return;
        const card = reviewQueue[currentIndex];
        if (confirm(`क्या आप इस कार्ड को हमेशा के लिए हटाना चाहते हैं:\n"${card.question}"?`)) {
          allCards = allCards.filter(c => c.id !== card.id);
          saveCards();
          populateSubjectFilter();
          buildReviewQueue();
          renderCard();
        }
      });

      // Save Card (Add or Edit)
      document.getElementById("btnSaveCard").addEventListener("click", () => {
        const id = document.getElementById("editCardId").value;
        const subject = document.getElementById("inputSubject").value.trim() || "सामान्य अध्ययन";
        const question = document.getElementById("inputQuestion").value.trim();
        const answer = document.getElementById("inputAnswer").value.trim();

        if (!question || !answer) {
          alert("कृपया प्रश्न और उत्तर दोनों भरें।");
          return;
        }

        if (id) {
          const existing = allCards.find(c => c.id === id);
          if (existing) {
            existing.subject = subject;
            existing.question = question;
            existing.answer = answer;
          }
        } else {
          allCards.unshift({
            id: "card_" + Date.now(),
            subject, question, answer,
            box: 1, repetitions: 0, lastReviewed: null
          });
        }

        saveCards();
        populateSubjectFilter();
        buildReviewQueue();
        renderCard();
        cardModal.style.display = "none";
      });

      document.getElementById("btnCancelCardModal").addEventListener("click", () => {
        cardModal.style.display = "none";
      });

      // Backup Modal Triggers
      document.getElementById("btnBackup").addEventListener("click", () => {
        document.getElementById("importJsonArea").value = "";
        backupModal.style.display = "flex";
      });
      document.getElementById("btnCloseBackupModal").addEventListener("click", () => {
        backupModal.style.display = "none";
      });

      // JSON Download
      document.getElementById("btnDownloadJson").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(allCards, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `bpsc_flashcards_${new Date().toISOString().split("T")[0]}.json`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // JSON Copy
      document.getElementById("btnCopyJson").addEventListener("click", () => {
        navigator.clipboard.writeText(JSON.stringify(allCards, null, 2))
          .then(() => alert("✅ पूरा डेटा क्लिपबोर्ड पर कॉपी हो गया!"))
          .catch(() => alert("कॉपी करने में त्रुटि।"));
      });

      // Bulk JSON Import
      document.getElementById("btnImportJson").addEventListener("click", () => {
        const raw = document.getElementById("importJsonArea").value.trim();
        if (!raw) { alert("कृपया JSON टेक्स्ट पेस्ट करें।"); return; }
        
        try {
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) throw new Error("डेटा JSON Array ([...]) फॉर्मेट में होना चाहिए।");

          let addedCount = 0;
          parsed.forEach(item => {
            if (item.question && item.answer) {
              allCards.push({
                id: item.id || ("card_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4)),
                subject: item.subject || "सामान्य अध्ययन",
                question: item.question,
                answer: item.answer,
                box: item.box || 1,
                repetitions: item.repetitions || 0,
                lastReviewed: item.lastReviewed || null
              });
              addedCount++;
            }
          });

          saveCards();
          populateSubjectFilter();
          buildReviewQueue();
          renderCard();
          backupModal.style.display = "none";
          alert(`🎉 ${addedCount} नए कार्ड सफलतापूर्वक जोड़ दिए गए!`);
        } catch (err) {
          alert("अमान्य JSON फॉर्मेट! कृपया संरचना जांचें।\n" + err.message);
        }
      });
    }

    // Initialize the application on load
    window.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
</html>
